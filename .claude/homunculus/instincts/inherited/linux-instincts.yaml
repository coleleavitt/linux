# Linux Workflow Driver Bugfix Single File

## Action

Follow the driver-bugfix-single-file workflow:
1. Identify the bug and its root cause in the driver source file.
2. Edit the relevant driver source file to fix the bug.
3. Write a detailed commit message explaining the bug, how it was fixed, and referencing any relevant bug reports or Fixes tags.
4. Commit the change.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~15x per month
- Files: drivers/*/*.c, drivers/*/*/*.c

